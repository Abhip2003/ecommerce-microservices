apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ecommerce
type: Opaque
stringData:
  POSTGRES_USER: "your-postgres-user"
  POSTGRES_PASSWORD: "your-postgres-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: ecommerce
type: Opaque
stringData:
  KEYCLOAK_ADMIN: "your-admin-user"
  KEYCLOAK_ADMIN_PASSWORD: "your-admin-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: ecommerce
type: Opaque
stringData:
  REDIS_PASSWORD: "your-redis-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: storage-secret
  namespace: ecommerce
type: Opaque
stringData:
  STORAGE_ACCESS_KEY: "your-storage-access-key"
  STORAGE_SECRET_KEY: "your-storage-secret-key"
---
apiVersion: v1
kind: Secret
metadata:
  name: elasticsearch-secret
  namespace: ecommerce
type: Opaque
stringData:
  ELASTIC_PASSWORD: "your-elasticsearch-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: mail-secret
  namespace: ecommerce
type: Opaque
stringData:
  MAIL_USERNAME: "your-email"
  MAIL_PASSWORD: "your-mail-password"